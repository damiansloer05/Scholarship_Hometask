# =============================================================
#  Cloud Build CI/CD Pipeline
#  Triggered on push to the main branch.
#  Substitution variables are set in the Cloud Build trigger:
#    _PROJECT_ID, _REGION, _ARTIFACT_REPO,
#    _API_IMAGE, _UI_IMAGE, _API_SERVICE, _UI_SERVICE
# =============================================================

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: admissions-repo
  _API_IMAGE: admissions-api
  _UI_IMAGE: admissions-ui
  _API_SERVICE: admissions-api
  _UI_SERVICE: admissions-ui

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── Step 1: Run API unit tests ──────────────────────────────────────────────
  - id: api-test
    name: node:20-alpine
    entrypoint: sh
    args:
      - -c
      - |
        cd api
        npm ci
        npm test
    waitFor: ['-']

  # ── Step 2: Build API Docker image ──────────────────────────────────────────
  - id: api-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runner
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_API_IMAGE:$COMMIT_SHA
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_API_IMAGE:latest
      - --cache-from=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_API_IMAGE:latest
      - ./api
    waitFor: [api-test]

  # ── Step 3: Build UI Docker image ───────────────────────────────────────────
  - id: ui-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runner
      - --build-arg=NUXT_PUBLIC_API_URL=https://api.scholershipowlhometask.com/graphql
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_UI_IMAGE:$COMMIT_SHA
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_UI_IMAGE:latest
      - --cache-from=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_UI_IMAGE:latest
      - ./ui
    waitFor: ['-']

  # ── Step 4: Push API image ───────────────────────────────────────────────────
  - id: api-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_API_IMAGE
    waitFor: [api-build]

  # ── Step 5: Push UI image ────────────────────────────────────────────────────
  - id: ui-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_UI_IMAGE
    waitFor: [ui-build]

  # ── Step 6: Run DB migrations via Cloud Run Job ──────────────────────────────
  - id: db-migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - admissions-migrate
      - --region=$_REGION
      - --wait
    waitFor: [api-push]

  # ── Step 7: Deploy API to Cloud Run ─────────────────────────────────────────
  - id: api-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_API_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_API_IMAGE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --quiet
    waitFor: [db-migrate]

  # ── Step 8: Deploy UI to Cloud Run ──────────────────────────────────────────
  - id: ui-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_UI_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_UI_IMAGE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --quiet
    waitFor: [ui-push]

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_API_IMAGE:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_UI_IMAGE:$COMMIT_SHA
