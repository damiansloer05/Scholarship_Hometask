version: '3.9'

# ---------------------------------------------------------------------------
# Local development stack — mirrors production GCP topology:
#   postgres  →  Cloud SQL (PostgreSQL 15)
#   api       →  Cloud Run: admissions-api
#   ui        →  Cloud Run: admissions-ui
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-admissions}
      POSTGRES_USER: ${DB_USER:-admissions_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace-with-a-32-char-secure-password}
    ports:
      - '${LOCAL_DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-admissions_user} -d ${DB_NAME:-admissions}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: development
    restart: unless-stopped
    ports:
      - '${LOCAL_API_PORT:-4000}:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://admissions_user:replace-with-a-32-char-secure-password@postgres:5432/admissions}
      CORS_ORIGIN: http://localhost:${LOCAL_UI_PORT:-3000}
    volumes:
      - ./api/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npm', 'run', 'dev']

  ui:
    build:
      context: ./ui
      target: development
    restart: unless-stopped
    ports:
      - '${LOCAL_UI_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      NUXT_PUBLIC_API_URL: http://localhost:${LOCAL_API_PORT:-4000}/graphql
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - api
    command: ['npm', 'run', 'dev']

volumes:
  postgres_data:
